<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Galeria Escolar</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:linear-gradient(180deg,#050a1a,#0b1026);
color:white;
overflow-x:hidden;
}

/* FUNDO CONSTELAÇÃO */

#space{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
}

/* GRADIENTES DECORATIVOS */

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,0,60,0.25), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(130,0,255,0.2), transparent 40%);
z-index:-1;
}

/* TITULO */

header{
text-align:center;
padding:60px 20px;
font-size:44px;
font-weight:700;
background:linear-gradient(90deg,#ff003c,#7a2cff,#d4af37);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* GALERIA */

.galeria{
max-width:1400px;
margin:auto;
padding:40px;

display:grid;
grid-template-columns:repeat(5,1fr);
gap:30px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.05);
border-radius:18px;
overflow:hidden;
backdrop-filter:blur(10px);
cursor:pointer;

transform-style:preserve-3d;
perspective:1000px;

transition:0.6s;

box-shadow:0 10px 40px rgba(0,0,0,0.7);
}

/* HOVER 3D */

.card:hover{
transform:
rotateX(8deg)
rotateY(-8deg)
scale(1.05);

box-shadow:
0 20px 70px rgba(255,0,60,0.5),
0 0 30px rgba(120,40,255,0.6);
}

/* IMAGEM */

.card img{
width:100%;
height:180px;
object-fit:cover;
transition:0.6s;
}

.card:hover img{
transform:scale(1.15);
}

/* TEXTO */

.card p{
padding:12px;
text-align:center;
font-size:14px;
color:#d8d8d8;
}

/* SLOT VAZIO */

.card:empty{
display:none;
}

/* LIGHTBOX */

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);

display:flex;
align-items:center;
justify-content:center;

opacity:0;
pointer-events:none;
transition:0.4s;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:12px;
box-shadow:0 0 40px rgba(255,0,60,0.8);
}

.lightbox.active{
opacity:1;
pointer-events:auto;
}

/* RESPONSIVO */

@media(max-width:1100px){

.galeria{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:700px){

.galeria{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<canvas id="space"></canvas>

<header>Galeria da Escola</header>

<div class="galeria">

<div class="card">
<img src="/assets/vd/img/feira1 (1).webp">
<p>Feira</p>
</div>

<div class="card">
<img src="/assets/vd/img/feira2.webp">
<p>Projeto de Arte</p>
</div>

<div class="card">
<img src="/assets/vd/img/feira3.webp">
<p>Evento Cultural</p>
</div>

<div class="card">
<img src="/assets/vd/img/macote1.webp">
<p>Excursão Escolar</p>
</div>

<div class="card">
<img src="/assets/vd/img/mascote2.webp">
<p>Projeto de Tecnologia</p>
</div>

<!-- slots extras -->

<div class="card">
<img src="/assets/vd/img/mascote3.webp">
<p>Projeto de Tecnologia</p>
</div>
<div class="card">
<img src="/assets/vd/img/orquestra.jpg">
<p>Projeto de Tecnologia</p>
</div>
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>

<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>

<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>
<div class="card"></div>

</div>

<div class="lightbox" id="lightbox">
<img id="lightbox-img">
</div>

<script>

/* CONSTELAÇÃO */

const canvas=document.getElementById("space");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];

for(let i=0;i<160;i++){
stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2,
speed:Math.random()*0.4
});
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

stars.forEach(s=>{

s.y+=s.speed;

if(s.y>canvas.height){
s.y=0;
s.x=Math.random()*canvas.width;
}

ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
ctx.fill();

});

requestAnimationFrame(draw);
}

draw();

/* LIGHTBOX */

const imgs=document.querySelectorAll(".card img");
const lightbox=document.getElementById("lightbox");
const lightboxImg=document.getElementById("lightbox-img");

imgs.forEach(img=>{
img.onclick=()=>{
lightbox.classList.add("active");
lightboxImg.src=img.src;
}
});

lightbox.onclick=()=>{
lightbox.classList.remove("active");
}

</script>

</body>
</html>
